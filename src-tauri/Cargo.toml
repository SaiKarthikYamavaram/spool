[package]
name = "spool"
version = "0.1.0"
description = "Personal segmented download manager"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "spool_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13.4", default-features = false, features = ["stream", "json", "default-tls", "cookies"] }
tokio = { version = "1.53.1", features = ["full"] }
tokio-util = { version = "0.7.19", features = ["rt"] }
futures-util = "0.3.34"
fs4 = { version = "1.1.0", features = ["tokio"] }
tauri-plugin-single-instance = "2.4.4"
tauri-plugin-dialog = "2.7.3"
tauri-plugin-notification = "2.4.0"
tiny_http = "0.12.0"
libc = "0.2.189"
tauri-plugin-window-state = "2"
base64 = "0.23.1"
tauri-plugin-autostart = "2"
tauri-plugin-clipboard-manager = "2"
sha2 = "0.11.0"
md-5 = "0.11.0"
suppaftp = { version = "12.0.0", features = ["tokio"] }
librqbit = "9.0.1"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
